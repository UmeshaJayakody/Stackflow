services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
    volumes:
      - stackflow_postgres_data:/var/lib/postgresql/data
    mem_limit: 150m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory_user} -d ${POSTGRES_DB:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/umeshajayakody/stackflow:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventory_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventory_db}?schema=public
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://stackflow.motionstack.org
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "127.0.0.1:8082:3000"
    mem_limit: 300m

volumes:
  stackflow_postgres_data:
